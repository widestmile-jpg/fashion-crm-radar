name: Fashion CRM Radar — Gmail connection check (no content)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmail-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal HTTP client
        run: python -m pip install --quiet requests
      - name: Test Gmail read-only access without downloading emails
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: python scripts/gmail_connection_check.py
